[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxtra-intake"
version = "0.1.0"
description = "Turn client banking tables into the events.parquet / profiles.parquet contract that pragmatiq reads."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
gpu = ["cudf-polars-cu12"]

[project.scripts]
fluxtra-intake = "intake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["intake"]
